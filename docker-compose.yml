# Docker's json-file driver does NOT rotate by default: a container's log grows until the
# disk does. On 2026-09-05 the `app` log reached 1.1 GB in 25 hours (Ecto was logging every
# collector insert with its parameters) and nothing would have stopped it before the 96 GB
# root filled. Every long-lived service gets this cap; 50m x 5 bounds each at 250 MB.
#
# 🔴 `logging:` is applied when a container is CREATED. `docker compose restart` does not
# pick it up — use `docker compose up -d <service>`, which recreates on a config change and
# starts a fresh log file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://fluxtrader:secret@postgres:5432/fluxtrader
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      TRADING_MODE: ${TRADING_MODE:-simulation}
      ML_INFERENCE_URL: http://ml_inference:8001
      # Serve/product gate. Eval (run 20260723) showed gate<=0.50 trades ~100% of
      # bars at ~coin-flip; edge only appears at gate>=0.55. 0.58 harvests it.
      ML_GATE_THRESHOLD: ${ML_GATE_THRESHOLD:-0.58}
      PHX_HOST: localhost
      PHX_PORT: 4000
      # Ecto per-query logging, off by default — see config/runtime.exs for why.
      # Set to `debug` only for a debugging session; it costs ~1 GB of log a day.
      ECTO_LOG_LEVEL: ${ECTO_LOG_LEVEL:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-secret-key-base-that-is-at-least-64-bytes-long-for-phoenix-to-start}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - app_build:/app/_build
      - app_deps:/app/deps
    # Deps are fetched AND compiled at image-build time (see Dockerfile.app), so
    # no memory-heavy `mix deps.compile` runs at boot — this avoids OOM kills on
    # small always-on hosts. The app_deps/app_build volumes seed from the image's
    # precompiled artifacts on first run; recreate them after a deploy that
    # changes deps (`docker compose down && docker volume rm trading_agent_app_deps
    # trading_agent_app_build`). deps.get stays (offline-tolerant) as a no-op when
    # the lockfile is already satisfied; `mix compile` only rebuilds changed app
    # source from the bind mount.
    command: sh -c "(mix deps.get || echo 'deps.get skipped (offline); using cached deps') && mix compile && mix ecto.create && mix ecto.migrate && mix phx.server"

  postgres:
    image: timescale/timescaledb:latest-pg16
    logging: *default-logging
    environment:
      POSTGRES_USER: fluxtrader
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fluxtrader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxtrader"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_inference:
    build:
      context: ./ml/train
      dockerfile: Dockerfile.train
    command: python serve.py
    logging: *default-logging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fluxtrader:secret@postgres:5432/fluxtrader
      MODEL_PATH: /models/m2_multi.pt
      MODEL_DIR: /models
      # DELIBERATELY has no default. serve.py treats a set GATE_THRESHOLD as an
      # operator OVERRIDE that beats the checkpoint's own measured gate, so a
      # default here would silently defeat C13 and serve every model at one
      # constant again. Empty => serve.py uses meta.served_gate from the
      # checkpoint. Set ML_GATE_THRESHOLD only to deliberately override it.
      GATE_THRESHOLD: ${ML_GATE_THRESHOLD:-}
      PRIMARY_HORIZON: ${PRIMARY_HORIZON:-30}
      HORIZONS_MINUTES: ${HORIZONS_MINUTES:-5,30,60}
      WHITELIST_PAIRS: ${WHITELIST_PAIRS:-BTCUSDT,ETHUSDT,SOLUSDT}
      OMP_NUM_THREADS: 2
    ports:
      - "8001:8001"
    volumes:
      - ./ml/train:/workspace/train
      - model_weights:/models
    depends_on:
      postgres:
        condition: service_healthy

  # Torch-free image for the M3 offline policy work (docs/M3_PLAN.md §2). It reads the
  # eval_preds.parquet dumps under ml/train/output/eval_dumps and needs no DB and no GPU,
  # so unlike ml_trainer it has no `depends_on`. Wrapped by scripts/m3.sh.
  ml_analysis:
    build:
      context: ./ml/train
      dockerfile: Dockerfile.analysis
    image: trading_agent-ml_analysis:latest
    environment:
      OUTPUT_DIR: /workspace/train/output
    working_dir: /workspace/train
    volumes:
      - ./ml/train:/workspace/train
    profiles:
      - ml

  ml_trainer:
    build:
      context: ./ml/train
      dockerfile: Dockerfile.train
    environment:
      DATABASE_URL: postgresql://fluxtrader:secret@postgres:5432/fluxtrader
      MODEL_DIR: /models
      OUTPUT_DIR: /workspace/train/output
      WHITELIST_PAIRS: ${WHITELIST_PAIRS:-BTCUSDT,ETHUSDT,SOLUSDT}
      HORIZON_MINUTES: ${HORIZON_MINUTES:-30}
      HORIZONS_MINUTES: ${HORIZONS_MINUTES:-5,30,60}
      PRIMARY_HORIZON: ${PRIMARY_HORIZON:-30}
      # Match the GCP training default (scripts/gcp_common.sh TRAIN_SEQ_LEN=128)
      SEQ_LEN: ${SEQ_LEN:-128}
      LR: ${LR:-5e-4}
      WEIGHT_DECAY: ${WEIGHT_DECAY:-1e-4}
      # Must match config.py's default. It used to be 5 while config.py said 10, so
      # an unset EARLY_STOP_PATIENCE gave the CPU (compose) path half the patience of
      # the GPU path — the same knob producing two different experiments.
      EARLY_STOP_PATIENCE: ${EARLY_STOP_PATIENCE:-10}
      CKPT_GATE_THRESHOLD: ${CKPT_GATE_THRESHOLD:-0.40}
      # Throughput: larger batch = better BLAS utilization; threads = use all vCPUs.
      BATCH_SIZE: ${BATCH_SIZE:-128}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    # train_m2.py uses torch's 'file_system' sharing strategy, so DataLoader
    # workers pass tensors as named files in /dev/shm. Docker's 64MB default
    # is far too small and the workers die with SIGBUS ("Bus error ... out of
    # shared memory"). Mirrors --shm-size on the GPU path in scripts/gcp_train.sh.
    shm_size: ${FLUX_SHM_SIZE:-4g}
    volumes:
      - ./ml/train:/workspace/train
      - model_weights:/models
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ml

volumes:
  app_build:
  app_deps:
  postgres_data:
  # Fixed name so GCP train/finish scripts and compose share one volume.
  # external: true avoids WARN when the volume was created via `docker volume create`
  # (scripts/import/gcp). Create once if missing:
  #   docker volume create trading_agent_model_weights
  model_weights:
    name: trading_agent_model_weights
    external: true
